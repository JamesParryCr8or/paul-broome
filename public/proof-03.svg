<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">True value removes price objections</title><desc id="desc">Branded cover for a Paul Broome sales mastery video.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061315"/><stop offset="1" stop-color="#102b2e"/></linearGradient><radialGradient id="gold"><stop stop-color="#d4af68" stop-opacity=".24"/><stop offset="1" stop-color="#d4af68" stop-opacity="0"/></radialGradient><pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#8fe7dc" stroke-opacity=".07"/></pattern></defs>
  <rect width="1280" height="720" fill="url(#bg)"/><rect width="1280" height="720" fill="url(#grid)"/><circle cx="1050" cy="250" r="430" fill="url(#gold)"/>
  <text x="72" y="82" fill="#ecd499" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">PAUL BROOME · SALES MASTERY 03</text>
  <text x="72" y="238" fill="#f3fbf8" font-family="Georgia,serif" font-size="68" font-weight="600">Price is never the objection</text><text x="72" y="318" fill="#f3fbf8" font-family="Georgia,serif" font-size="68" font-weight="600">when true value is present.</text>
  <text x="74" y="386" fill="#9db7b2" font-family="Arial,sans-serif" font-size="24">Make value tangible, measurable and verifiable.</text>
  <circle cx="640" cy="548" r="66" fill="#84eadc"/><path d="M624 514l56 34-56 34z" fill="#071719"/>
  <text x="640" y="652" text-anchor="middle" fill="#d7e8e4" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">PRESS PLAY</text>
</svg>
